name: DSKAI bridge isolated tests
on:
  push:
    branches: [codex/dskai-director-bridge]
  pull_request:
    branches: [dskai-bridge-contract]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r dskai_bridge/requirements.txt
      - name: Compile implementation
        run: python -m compileall -q dskai_bridge
      - name: Deterministic contract, recovery, auth and media tests
        run: python -m unittest dskai_bridge.test_bridge -v
      - name: Check frontend syntax
        run: |
          node --check dskai_bridge/ui/studio.js
          node --check dskai_bridge/ui/login.js
      - name: Install isolated Backlot and browser test dependencies
        run: |
          python -m pip install pyyaml==6.0.2 watchfiles==1.0.5 Pillow==11.2.1 playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Browser integration with synthetic fixtures
        run: python -m unittest dskai_bridge.test_browser -v
      - name: Export protocol schemas
        run: python -m dskai_bridge schema > test-artifacts/protocol-v2.schemas.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-studio-browser-evidence
          path: test-artifacts/
